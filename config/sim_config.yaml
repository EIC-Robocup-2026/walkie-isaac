# ==============================================================================
# Walkie Bot - Isaac Sim Top-Level Master Configuration
# RoboCup 2027
# ==============================================================================

simulation:
  headless: false
  physics_dt: 0.016666667   # 60 Hz physics step
  rendering_dt: 0.016666667 # 60 Hz rendering step

environment:
  type: "warehouse"         # Options: "warehouse" (standard Isaac Sim warehouse), "ground_plane"
  warehouse_usd: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.1/Isaac/Environments/Simple_Warehouse/warehouse.usd"

robot:
  usd_path: "assets/Collected_gz_walkie_roller/gz_walkie_roller_absolute_path.usda"
  prim_path: "/World/walkie_bot"
  spawn_position: [0.0, 0.0, 0.05] # [x, y, z] in meters (slightly elevated for wheel contact)
  spawn_orientation: [1.0, 0.0, 0.0, 0.0]

# ------------------------------------------------------------------------------
# Modular Subsystem Configuration Files
# Relative to this config directory (or absolute paths)
# ------------------------------------------------------------------------------
modules:
  drivebase: "drivebase.yaml"
  arm: "arm.yaml"
  sensors: "sensors.yaml"

# ------------------------------------------------------------------------------
# ROS 2 Bridge & Middleware Settings
# ------------------------------------------------------------------------------
ros2:
  rmw: "rmw_zenoh_cpp"
  domain_id: 0
  clock_topic: "/clock"
  cmd_vel_topic: "/cmd_vel"
  joint_states:
    enabled: true
    topic_name: "/isaac_joint_states"
    publish_rate_hz: 60.0
  joint_commands:
    enabled: true
    topic_name: "/isaac_joint_commands"
  tf:
    # Set to false by default so the main ROS 2 architecture (robot_state_publisher)
    # handles all TF transforms from URDF without publisher conflicts.
    # Set to true only for quick standalone Isaac Sim visualization without ROS 2 nodes.
    enabled: false
    topic_name: "/tf"
    static_topic_name: "/tf_static"
    parent_prim: "/World/walkie_bot/Geometry/base_footprint"
