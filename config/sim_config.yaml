# Walkie Bot - Isaac Sim Configuration
# RoboCup 2027

simulation:
  headless: false
  physics_dt: 0.016666667   # 60 Hz physics step
  rendering_dt: 0.016666667 # 60 Hz rendering step

environment:
  type: "warehouse"         # Options: "warehouse" (standard Isaac Sim warehouse), "ground_plane"
  warehouse_usd: "https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.1/Isaac/Environments/Simple_Warehouse/warehouse.usd"

robot:
  usd_path: "assets/Collected_gz_walkie_roller/gz_walkie_roller_absolute_path.usda"
  prim_path: "/World/walkie_bot"
  spawn_position: [0.0, 0.0, 0.05] # [x, y, z] in meters (slightly elevated for wheel contact)
  spawn_orientation: [1.0, 0.0, 0.0, 0.0]

sensors:
  # ----------------------------------------------------------------------------
  # 2D LiDAR (Center / Merged planar scan, default like Gazebo setup)
  # ----------------------------------------------------------------------------
  lidar_2d:
    enabled: true
    mount_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/merged_lidar_link"
    sensor_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/merged_lidar_link/RtxLidar2D"
    frame_id: "merged_lidar_link"
    topic_name: "/scan"
    type: "laser_scan"
    horizontal_fov: 360.0
    min_range: 0.05
    max_range: 25.0

  # ----------------------------------------------------------------------------
  # 3D LiDAR (Unitree 4D LiDAR L2 multi-ring point cloud)
  # ----------------------------------------------------------------------------
  lidar_3d:
    enabled: true
    mount_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/unitree4d_l2_imu_initial"
    sensor_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/unitree4d_l2_imu_initial/RtxLidar3D"
    frame_id: "unitree4d_l2_imu_initial"
    topic_name: "/unilidar/cloud"
    type: "point_cloud"
    horizontal_fov: 360.0
    min_range: 0.1
    max_range: 30.0

  # ----------------------------------------------------------------------------
  # IMU (Located at the 3D LiDAR unit)
  # ----------------------------------------------------------------------------
  imu:
    enabled: true
    mount_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/unitree4d_l2_imu_initial/unitree4d_l2_imu"
    sensor_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/unitree4d_l2_imu_initial/unitree4d_l2_imu/ImuSensor"
    frame_id: "unitree4d_l2_imu"
    topic_name: "/unilidar/imu"

  # ----------------------------------------------------------------------------
  # Head Camera (ZED 2i: RGB + Depth + 3D Point Cloud)
  # ----------------------------------------------------------------------------
  head_camera:
    enabled: true
    mount_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/lift_link/head_servo_link/zed_head_camera_link/zed_head_camera_center/zed_head_left_camera_frame/zed_head_left_camera_frame_optical"
    camera_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/lift_link/head_servo_link/zed_head_camera_link/zed_head_camera_center/zed_head_left_camera_frame/zed_head_left_camera_frame_optical/Camera"
    frame_id: "zed_head_left_camera_frame_optical"
    width: 640
    height: 360
    focal_length: 24.0
    rgb_topic: "/zed_head/zed_node/rgb/image_rect_color"
    rgb_info_topic: "/zed_head/zed_node/rgb/camera_info"
    depth_topic: "/zed_head/zed_node/depth/depth_registered"
    depth_pcl_topic: "/zed_head/zed_node/point_cloud/cloud_registered"

  # ----------------------------------------------------------------------------
  # Bottom Camera (RealSense D415: RGB + Depth + 3D Point Cloud)
  # ----------------------------------------------------------------------------
  bottom_camera:
    enabled: true
    mount_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/bottom_bottom_screw_frame/bottom_link/bottom_depth_frame/bottom_color_frame/bottom_color_optical_frame"
    camera_prim_path: "/World/walkie_bot/Geometry/base_footprint/base_link/bottom_bottom_screw_frame/bottom_link/bottom_depth_frame/bottom_color_frame/bottom_color_optical_frame/Camera"
    frame_id: "bottom_color_optical_frame"
    width: 640
    height: 480
    focal_length: 24.0
    rgb_topic: "/bottom/color/image_raw"
    rgb_info_topic: "/bottom/color/camera_info"
    depth_topic: "/bottom/depth/image_rect_raw"
    depth_pcl_topic: "/camera/camera/depth/color/points"

ros2:
  rmw: "rmw_zenoh_cpp"
  domain_id: 0
  clock_topic: "/clock"
  cmd_vel_topic: "/cmd_vel"
  joint_states:
    enabled: true
    topic_name: "/joint_states"
  joint_commands:
    enabled: true
    topic_name: "/joint_commands"
  tf:
    # Set to false by default so the main ROS 2 architecture (robot_state_publisher)
    # handles all TF transforms from URDF without publisher conflicts.
    # Set to true only for quick standalone Isaac Sim visualization without ROS 2 nodes.
    enabled: false
    topic_name: "/tf"
    static_topic_name: "/tf_static"
    parent_prim: "/World/walkie_bot/Geometry/base_footprint"
